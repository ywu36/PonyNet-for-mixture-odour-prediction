[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pony-odour"
version = "1.0.0"
description = "Pony: a small graph network that predicts how different two odour mixtures smell"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rein (Yuhang) Wu"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "rdkit>=2023.3"]

[project.optional-dependencies]
research = ["pandas", "scipy", "scikit-learn", "matplotlib"]
test = ["pytest"]

[tool.setuptools]
packages = ["pony", "mixdist"]

[tool.setuptools.package-data]
pony = ["weights/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
